name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# the deploy-pages action needs these
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, newer push wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on if the repository has it off
      - name: Upload the site (it is plain static files, no build step)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
